name: Refresh public SEC filings
on:
  workflow_dispatch:
  schedule:
    - cron: '19 7 * * 1,4'
permissions:
  contents: write
concurrency:
  group: sec-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public SEC XBRL data
        env:
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}
        run: python scripts/update_sec.py
      - name: Commit updated disclosures only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dated SEC filing facts"
            git push
          fi
